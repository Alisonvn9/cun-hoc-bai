<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Học bài mỗi ngày cùng Cún</title><meta name="robots" content="noindex,nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: an exam answer sheet — ink-blue paper header, ruled question blocks, red-pen marking for the parent. */
:root{
  --paper:#F4F6FB; --sheet:#FFFFFF; --ink:#1A2433; --muted:#5B6678; --line:#DCE3EE;
  --accent:#24408E; --sun:#F2A541; --sun-line:#F2C27A; --accent-soft:#E6EEFA; --pen:#C23A2B; --pen-soft:#FBEAE7;
  --good:#1E7A4C; --good-soft:#E3F3EA; --warn:#A86200; --warn-soft:#FBF0DC;
  --c-mc:#6B4FB8; --c-en:#1F4E9A; --c-ma:#0F7A72; --c-vn:#B5452E;
  --f-head:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11161F; --sheet:#18202C; --ink:#E6ECF5; --muted:#9AA6B8; --line:#2A3546;
  --accent:#7FA8F0; --accent-soft:#1D2B44; --pen:#F08372; --pen-soft:#3A2220;
  --good:#5CC892; --good-soft:#163527; --warn:#E7B45A; --warn-soft:#3A2C12;
  --c-mc:#A893EC; --c-en:#7FA8F0; --c-ma:#4FC7BB; --c-vn:#EE8C74; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161F; --sheet:#18202C; --ink:#E6ECF5; --muted:#9AA6B8; --line:#2A3546;
  --accent:#7FA8F0; --accent-soft:#1D2B44; --pen:#F08372; --pen-soft:#3A2220;
  --good:#5CC892; --good-soft:#163527; --warn:#E7B45A; --warn-soft:#3A2C12;
  --c-mc:#A893EC; --c-en:#7FA8F0; --c-ma:#4FC7BB; --c-vn:#EE8C74; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-head);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 4px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand small{color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:999px;font-size:.9rem}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.btn{font:inherit;font-weight:600;border:1px solid transparent;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--accent);color:var(--sheet);text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.pen{background:var(--pen);color:var(--sheet)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.opt:focus-within,input:focus-visible,textarea:focus-visible,.nav a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.part{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px}
.part b{font-family:var(--f-head);font-weight:600}
.tick{color:var(--good);font-weight:700}
.chip{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.s-mc{color:var(--c-mc)} .s-english{color:var(--c-en)} .s-math{color:var(--c-ma)} .s-vietnamese{color:var(--c-vn)}
/* test */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-family:var(--f-head);font-size:1.9rem;line-height:1.1;padding:8px 20px;min-width:5.5ch;text-align:center;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.timer.over{background:var(--pen-soft);color:var(--pen)}
.passage{background:var(--accent-soft);border-radius:8px;padding:14px 16px;white-space:pre-line}
.passage h3{margin-bottom:6px}
.q{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.q:first-child{border-top:0;padding-top:0}
.qn{font-family:var(--f-head);font-weight:600;color:var(--muted);font-size:.85rem}
.qt{white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tf{display:flex;gap:8px}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:90px;resize:vertical}
textarea.long{min-height:260px;line-height:1.9;background-image:linear-gradient(transparent calc(1.9em - 1px),var(--line) 1px);background-size:100% 1.9em;background-attachment:local}
.listen{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem}
/* results */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.score{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.score .num{font-family:var(--f-head);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:currentColor}
.band{font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:999px;align-self:flex-start}
.b0{background:var(--pen-soft);color:var(--pen)} .b1{background:var(--warn-soft);color:var(--warn)} .b2{background:var(--good-soft);color:var(--good)}
.lv{display:flex;gap:12px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
/* marking */
.mark{border-left:3px solid var(--pen);padding-left:12px;display:flex;flex-direction:column;gap:8px}
.ans{background:var(--paper);border-radius:6px;padding:8px 10px;white-space:pre-wrap;min-height:1.5em}
.key{color:var(--good);font-size:.9rem;white-space:pre-line}
.pts{display:flex;gap:8px;align-items:center}
.pts input{width:90px}
.auto{font-size:.8rem;font-weight:600}
.auto.ok{color:var(--good)} .auto.no{color:var(--pen)}
/* plan */
.phases{display:grid;gap:8px}
.phase{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 12px;border-radius:8px;border:1px solid var(--line)}
.phase.now{border-color:var(--accent);background:var(--accent-soft)}
.phase .dt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;grid-column:1/-1}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.day{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day h3{font-size:.95rem}
.sess{border-left:3px solid currentColor;padding-left:10px;display:flex;flex-direction:column;gap:2px}
.sess b{font-size:.9rem}
.sess span{color:var(--ink);font-size:.85rem}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:8px;background:var(--pen-soft)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
.fields{display:grid;gap:8px}
.fields label{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:center;font-weight:600}
@media (max-width:420px){.fields label{grid-template-columns:1fr;gap:4px}}
.timer-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
/* Vịt Alex + home */
.brand h1{font-weight:800}
.alex{display:flex;gap:12px;align-items:flex-end}
.alex img{width:120px;height:120px;flex:none;display:block;margin:-8px -6px -4px -10px}
.bubble{background:var(--sheet);border:1.5px solid var(--sun-line);border-radius:18px 18px 18px 4px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.bubble b{font-family:var(--f-head);font-size:1.2rem;line-height:1.25}
.countdown{background:#24408E;color:#fff;border-color:#24408E}
.countdown .muted{color:#DCE4FF}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cd div{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center}
.cd b{font-family:var(--f-head);font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:.8rem;color:#DCE4FF}
.goal{position:relative;height:14px;background:var(--line);border-radius:99px;margin-block:6px}
.goal i{position:absolute;left:0;top:0;bottom:0;background:var(--sun);border-radius:99px}
.goal .cut{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted)}
.goal .aim{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--accent);border-radius:2px}
.big{font-family:var(--f-head);font-weight:800;font-size:2rem;color:var(--accent);line-height:1}
.lesson{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--paper);min-height:44px;cursor:pointer}
.lesson input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.lesson span{display:flex;flex-direction:column}
@media (max-width:480px){.alex img{width:100px;height:100px}.cd b{font-size:1.6rem}}
.login{max-width:560px;margin:16px auto;display:flex;flex-direction:column;gap:16px}
.login-hi{text-align:center;font-size:1.05rem}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.who{font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 16px;border-radius:22px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);text-align:center}
.who b{font-family:var(--f-head);font-size:1.45rem;line-height:1.2}
.who span{color:var(--muted);font-size:.9rem}
.who-kid{border-color:var(--sun-line);background:#FFF7E8}
.who-kid b{color:#8A4B00}
.who-parent{color:var(--accent)}
.who:hover,.who:focus-visible{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.login-card{gap:14px}
.login-head{display:flex;gap:12px;align-items:center}
.login-head svg{width:72px;height:72px}
.code-in{font-size:1.4rem!important;letter-spacing:.06em}
@media (prefers-color-scheme:dark){.who-kid{background:var(--sheet)}.who-kid b{color:var(--sun)}}
.role-student .parent-only,.role-student a[href="#marking"]{display:none!important}
.nav .logout{opacity:.75}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><small>Luyện thi lớp 6</small><h1>Học bài mỗi ngày cùng Cún</h1></div>
    <nav class="nav" id="nav">
      <a href="#home">Trang chính</a><a href="#results">Kết quả</a><a href="#plan">Kế hoạch</a><a href="#marking" class="parent-only">Chấm bài</a><a href="#logout" class="logout">Đăng xuất</a>
    </nav>
  </header>
  <div id="banner" hidden class="banner"></div>
  <main id="view" class="wrap"><div class="card"><p class="muted">Đang tải bộ câu hỏi…</p></div></main>
</div>

<script>(() => {
const L = window.TDN_LOCKED;
const KEY = "tdn:login";
const d64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const NAMES = {student: "Học sinh", parent: "Phụ huynh"};
const view = document.getElementById("view"), nav = document.getElementById("nav");

async function tryCode(code, role){
  const c = norm(code);
  if (!c || !window.crypto || !crypto.subtle) return null;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(c), "PBKDF2", false, ["deriveKey"]);
  /* the code prefix (HS / PH) says which account to try first */
  const order = L.keys.slice().sort((a, b) => (c.startsWith(b.role === "parent" ? "PH" : "HS") ? 1 : 0) - (c.startsWith(a.role === "parent" ? "PH" : "HS") ? 1 : 0));
  for (const w of order.filter(w => !role || w.role === role)) {
    const kek = await crypto.subtle.deriveKey({name: "PBKDF2", salt: d64(w.salt), iterations: L.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    try {
      const raw = await crypto.subtle.decrypt({name: "AES-GCM", iv: d64(w.iv)}, kek, d64(w.key));
      const dk = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
      const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: d64(L.iv)}, dk, d64(L.data));
      return {role: w.role, bank: JSON.parse(new TextDecoder().decode(pt))};
    } catch (e) { /* not this account */ }
  }
  return null;
}

function enter(res, resolve){
  window.TDN_BANK = res.bank;
  window.TDN_ROLE = res.role;
  document.documentElement.classList.add("role-" + res.role);
  const out = nav.querySelector(".logout");
  if (out) out.textContent = "Đăng xuất (" + NAMES[res.role] + ")";
  nav.style.display = "";
  view.innerHTML = '<div class="card"><p class="muted">Đang tải bộ câu hỏi…</p></div>';
  resolve();
}

window.TDN_LOGOUT = () => {
  try { localStorage.removeItem(KEY); } catch (e) {}
  location.replace(location.pathname + "#home");
  location.reload();
};

window.TDN_UNLOCK = new Promise(async resolve => {
  nav.style.display = "none";
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    view.innerHTML = '<div class="card"><p class="muted">Đang mở…</p></div>';
    const res = await tryCode(saved);
    if (res) return enter(res, resolve);
    try { localStorage.removeItem(KEY); } catch (e) {}
  }
  const face = (window.ALEX_FACES || {}).smile;
  const PARENT_ICON = `<svg width="96" height="96" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17" cy="14" r="6"></circle><circle cx="32" cy="16" r="5"></circle><path d="M6 40c0-7 5-12 11-12s11 5 11 12"></path><path d="M26 30c2-2 4-3 6-3 5 0 9 4 9 11"></path></svg>`;
  function chooser(){
    view.innerHTML = `<div class="login">
      <p class="login-hi">Chào mừng đến với <b>Học bài mỗi ngày cùng Cún</b>! Ai đang vào học vậy?</p>
      <div class="pick">
        <button type="button" class="who who-kid" data-role="student">${face ? `<img src="${face}" alt="" width="132" height="132">` : ""}<b>Cún click vào đây nhé</b><span>Vào học với Vịt Alex</span></button>
        <button type="button" class="who who-parent" data-role="parent">${PARENT_ICON}<b>Bố mẹ</b><span>Chấm bài, xem kết quả và kế hoạch</span></button>
      </div></div>`;
    view.querySelectorAll("[data-role]").forEach(b => b.onclick = () => askCode(b.dataset.role));
  }
  function askCode(role){
    const kid = role === "student";
    view.innerHTML = `<div class="login"><div class="card login-card">
      <div class="login-head">${kid ? (face ? `<img src="${face}" alt="Vịt Alex đang cười" width="96" height="96">` : "") : `<span class="who-parent">${PARENT_ICON}</span>`}
        <div><h2>${kid ? "Chào Cún!" : "Bố mẹ đăng nhập"}</h2><p class="small">${kid ? "Cún nhập mã của mình để vào học với tớ nhé!" : "Nhập mã của bố mẹ."}</p></div></div>
      <form id="loginForm" autocomplete="off">
        <label class="small" for="code">Mã của ${kid ? "Cún" : "bố mẹ"}</label>
        <input type="${kid ? "text" : "password"}" id="code" autocapitalize="off" spellcheck="false" class="code-in">
        <label class="small" style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="remember" checked style="width:auto"> Ghi nhớ trên máy này</label>
        <div class="row"><button class="btn" id="go" type="submit">${kid ? "Vào học" : "Đăng nhập"}</button><button class="btn ghost" id="back" type="button">Quay lại</button></div>
        <p class="small" id="loginMsg" role="alert"></p>
      </form></div></div>`;
    const form = document.getElementById("loginForm"), msg = document.getElementById("loginMsg"), go = document.getElementById("go");
    document.getElementById("back").onclick = chooser;
    document.getElementById("code").focus();
    form.onsubmit = async ev => {
      ev.preventDefault();
      const code = document.getElementById("code").value;
      go.disabled = true; msg.textContent = "Đang kiểm tra…";
      const res = await tryCode(code, role);
      go.disabled = false;
      if (!res) { msg.textContent = kid ? "Mã chưa đúng rồi. Cún thử lại hoặc hỏi bố mẹ nhé." : "Mã chưa đúng."; return; }
      if (document.getElementById("remember").checked) { try { localStorage.setItem(KEY, norm(code)); } catch (e) {} }
      enter(res, resolve);
    };
  }
  chooser();
});
})();
</script>

/* ---------- marking ---------- */
const normEn = s => " " + String(s||"").toLowerCase().replace(/[’‘`]/g,"'")
  .replace(/\bcan't\b/g,"cannot").replace(/\bcan not\b/g,"cannot").replace(/\bwon't\b/g,"will not")
  .replace(/n't\b/g," not").replace(/'ll\b/g," will").replace(/\bi'm\b/g,"i am").replace(/'re\b/g," are").replace(/\bit's\b/g,"it is")
  .replace(/[.,!?;:"“”()]/g," ").replace(/-/g," ").replace(/\s+/g," ").trim() + " ";
const normVi = s => String(s||"").normalize("NFC").toLowerCase().replace(/[.,!?;:"“”()]/g," ").replace(/\s+/g," ").trim();
const nums = s => (String(s||"").replace(/(\d)[\s.](?=\d{3}\b)/g,"$1").match(/\d+(?:,\d+)?/g) || []).map(x => x.replace(",", ".")).sort();
function fieldVals(it, val){
  const out = it.fields.map(() => "");
  String(val || "").split(";").forEach(seg => { const k = seg.indexOf(":"); if (k < 0) return;
    const i = it.fields.indexOf(seg.slice(0, k).trim()); if (i >= 0) out[i] = seg.slice(k + 1).trim(); });
  return out;
}
function maxPts(it){ const o = placement.overrides[it.id]; return (o && o.points) || it.points || 1; }
function autoMark(it, v){
  const max = maxPts(it);
  if (v == null || String(v).trim() === "") return 0;
  if (it.fields) {
    const got = fieldVals(it, v);
    if (got.every(x => !x)) return 0;
    const ok = it.field_answers && got.every((x, i) => normVi(x) === normVi(it.field_answers[i]));
    return ok ? max : null; /* not an exact match: a parent checks it */
  }
  switch (it.type) {
    case "mcq": case "true_false": return v === it.answer ? max : 0;
    case "gap": case "sentence_build": {
      const ok = [it.answer, ...(it.accept||[])].some(a => normEn(a) === normEn(v));
      return ok ? max : null; /* not matched: let a parent check spelling variants */
    }
    case "number": return nums(v).join() === nums(it.answer).join() && nums(v).length ? max : 0;
    case "text": {
      const a = nums(it.answer);
      if (a.length) return nums(v).join() === a.join() ? max : 0;
      return normVi(v).includes(normVi(it.answer)) ? max : 0;
    }
    default: return null; /* open, writing: parent marks */
  }
}
function finalPts(id){
  const a = attempt;
  if (a.marks && a.marks[id] != null) return a.marks[id];
  return a.auto ? a.auto[id] : null;
}
function pendingIds(){
  if (!attempt) return [];
  return placement.parts.flatMap(p => p.items).filter(id => attempt.partsDone.includes(partOf(id)) && finalPts(id) == null);
}
const partOf = id => placement.parts.find(p => p.items.includes(id)).part;

/* ---------- scoring ---------- */
function bandOf(pct){ return pct < 40 ? 0 : pct <= 70 ? 1 : 2; }
function scoreSections(){
  const out = {};
  for (const p of placement.parts) {
    let got = 0, max = 0, unmarked = 0; const lv = {1:[0,0],2:[0,0],3:[0,0]}; const weak = {};
    for (const id of p.items) {
      const it = items[id], m = maxPts(it), f = finalPts(id);
      max += m; lv[it.level][1] += m;
      if (f == null) { unmarked++; continue; }
      got += f; lv[it.level][0] += f;
      if (f < m) { const t = it.topic || it.skill; weak[t] = (weak[t]||0) + (m - f); }
    }
    const pct = max ? Math.round(got / max * 100) : 0;
    out[p.section] = {got, max, pct, band: bandOf(pct), lv, unmarked,
      weak: Object.entries(weak).sort((a,b) => b[1]-a[1]).map(([t]) => t)};
  }
  return out;
}

const PHASES = [
  {name:"Củng cố nền tảng lớp 4", from:"2026-11-01", to:"2027-05-31", min:30},
  {name:"Hè: cầu nối lên lớp 5", from:"2027-06-01", to:"2027-08-31", min:40},
  {name:"Lớp 5 + kỹ năng làm bài", from:"2027-09-01", to:"2028-02-29", min:45},
  {name:"Luyện đề thi thật (2022–2026) và đề tự soạn", from:"2028-03-01", to:"2028-06-30", min:60}
];
function buildPlan(sc){
  const now = new Date();
  const phase = PHASES.find(p => now <= new Date(p.to + "T23:59:59+07:00")) || PHASES[3];
  /* sessions per week: weaker = more; English sections weigh about half the exam */
  const per = {}; let total = 0;
  for (const s of Object.keys(SECTIONS)) {
    const b = sc[s].band; let n = b === 0 ? 3 : 2;
    if (s === "english" && b < 2) n += 1;
    per[s] = n; total += n;
  }
  const order = Object.keys(SECTIONS).flatMap(s => Array(per[s]).fill(s));
  /* interleave subjects so one day never repeats a subject */
  const queue = []; const pools = Object.keys(SECTIONS).map(s => order.filter(x => x === s));
  while (pools.some(p => p.length)) for (const p of pools.sort((a,b) => b.length - a.length)) if (p.length) queue.push(p.pop());
  const days = ["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ Nhật"];
  const cap = [2,2,2,2,2,3,0];
  const week = days.map(d => ({day:d, sessions:[]}));
  const topicIdx = {};
  let di = 0;
  for (const s of queue) {
    let tries = 0;
    while ((week[di].sessions.length >= cap[di] || week[di].sessions.some(x => x.section === s)) && tries < 14) { di = (di + 1) % 7; tries++; }
    if (tries >= 14) di = 5;
    const w = sc[s].weak; const i = topicIdx[s] = (topicIdx[s] ?? -1) + 1;
    week[di].sessions.push({section:s, minutes:phase.min, focus: w.length ? (TOPIC[w[i % w.length]] || w[i % w.length]) : "Ôn tập tổng hợp", activity: ACT[s][sc[s].band]});
    di = (di + 1) % 7;
  }
  week[6].sessions = [];
  return {generatedAt: new Date().toISOString(), phase: phase.name, minutes: phase.min, perWeek: per, totalSessions: total, week,
    bands: Object.fromEntries(Object.entries(sc).map(([k,v]) => [k, {pct:v.pct, band:BANDS[v.band].name, weak:v.weak.slice(0,5)}]))};
}

function shuffled(it){
  /* stable per-item shuffle so the answer is not always in the same slot */
  const idx = it.options.map((_, i) => i);
  let h = 0; for (const c of it.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  for (let i = idx.length - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx;
}
function renderItem(it, n, val){

  let body = "";
  const ov = placement.overrides[it.id];
  const qtext = it.question + (ov && ov.question_suffix || "");
  if (it.type === "mcq") {
    body = `<div class="opts">${shuffled(it).map((oi, k) => { const L = "ABCD"[oi];
      return `<label class="opt"><input type="radio" name="${name}" id="${name}_${L}" value="${L}" ${val === L ? "checked" : ""}><span>${esc(it.options[oi])}</span></label>`; }).join("")}</div>`;
  } else if (it.type === "true_false") {
    body = `<div class="tf">${[["T","True"],["F","False"]].map(([k,l]) => `<label class="opt"><input type="radio" name="${name}" id="${name}_${k}" value="${k}" ${val === k ? "checked" : ""}><span>${l}</span></label>`).join("")}</div>`;
  } else if (it.type === "writing") {
    body = `<textarea class="long" id="${name}" name="${name}" placeholder="Viết bài ở đây…">${esc(val)}</textarea>`;
  } else if (it.fields) {
    const parts = fieldVals(it, val);
    body = `<div class="fields">${it.fields.map((f, i) => `<label for="${name}__${i}"><span>${esc(f)}:</span><input type="text" id="${name}__${i}" data-field="${name}" autocomplete="off" value="${esc(parts[i])}"></label>`).join("")}</div>`;
  } else if (it.type === "open") {
    body = `<textarea id="${name}" name="${name}">${esc(val)}</textarea>`;
  } else {
    body = `<input type="text" id="${name}" name="${name}" autocomplete="off" value="${esc(val)}"${it.unit ? ` placeholder="Đơn vị: ${esc(it.unit)}"` : ""}>`;
  }
  const label = it.passage && passages[it.passage] && passages[it.passage].kind === "cloze" ? `Chỗ trống ${esc(it.question)}` : esc(qtext);
  return `<div class="q"><span class="qn">Câu ${n}</span><div class="qt">${label}</div>${body}</div>`;
}
function renderPassage(p){
  if (p.kind === "listening") {
    return `<div class="passage"><h3>Listening · ${esc(p.title)}</h3><p class="small">${esc(p.instructions)}</p>
      <div class="listen"><button class="btn" data-listen="${p.id}">▶ Nghe bài</button><span class="small muted" id="lc_${p.id}">Được nghe 2 lần</span></div>
      <details><summary>Phụ huynh đọc to (nếu máy không phát được tiếng)</summary><p>${esc(p.script)}</p></details></div>`;
  }
  return `<div class="passage"><h3>${esc(p.title)}</h3>${p.instructions ? `<p class="small">${esc(p.instructions)}</p>` : ""}<p>${esc(p.text)}</p></div>`;
}
const listenCount = {};
async function playScript(p, btn){
  listenCount[p.id] = listenCount[p.id] || 0;
  if (listenCount[p.id] >= 2) return;
  listenCount[p.id]++;
  const left = 2 - listenCount[p.id];
  $("#lc_" + p.id).textContent = left ? "Còn 1 lần nghe" : "Đã nghe đủ 2 lần";
  btn.disabled = true;
  const done = () => { btn.disabled = listenCount[p.id] >= 2; };
  if (tts) {
    try { await tts.speak(p.script, {language: "en", rate: 0.9}); return done(); } catch (e) { /* fall through */ }
  }
  if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
    try {
      const u = new SpeechSynthesisUtterance(p.script); u.lang = "en-GB"; u.rate = 0.85;
      u.onend = done; u.onerror = () => { done(); $("#lc_" + p.id).textContent = "Máy không phát được tiếng — phụ huynh đọc to đoạn bên dưới."; };
      speechSynthesis.speak(u); return;
    } catch {}
  }
  done(); $("#lc_" + p.id).textContent = "Máy không phát được tiếng — phụ huynh đọc to đoạn bên dưới.";
}

function viewPart(n){
  const v = $("#view");
  if (!attempt) { location.hash = "home"; return; }
  const p = placement.parts.find(x => x.part === n);
  if (!p) { location.hash = "home"; return; }
  const draftKey = "draft:" + attempt.id + ":" + n;
  const draft = Object.assign({}, local.get(draftKey) || {}, attempt.answers);
  const shown = new Set(); let html = ""; let k = 0;
  for (const id of p.items) {
    const it = items[id];
    if (it.passage && !shown.has(it.passage) && passages[it.passage]) { shown.add(it.passage); html += `</div><div class="card">${renderPassage(passages[it.passage])}`; }
    html += renderItem(it, ++k, draft[id]);
  }
  const already = attempt.partsDone.includes(n);
  v.innerHTML = `<div class="sticky"><div><span class="chip s-${p.section}">Phần ${n}/4</span> <b>${esc(p.name)}</b></div><span class="timer-wrap"><span class="small muted">Thời gian còn lại</span><span class="timer" id="timer" role="timer" aria-live="off"></span></span></div>
    ${already ? `<div class="banner">Phần này đã nộp. Có thể xem lại; sửa câu trả lời rồi nộp lại sẽ chấm lại phần này.</div>` : ""}
    <div class="card">${html}</div>
    <div class="row"><button class="btn" id="submit">Nộp phần ${n}</button><a class="btn ghost" href="#home">Lưu và làm sau</a></div>`;
  v.querySelectorAll(".card").forEach(c => { if (!c.textContent.trim()) c.remove(); });
  const collect = () => { const a = {}; for (const id of p.items) { const nm = "q_" + id; const r = v.querySelector(`input[name="${nm}"]:checked`); const t = v.querySelector(`#${CSS.escape(nm)}`); const fs = v.querySelectorAll(`[data-field="${nm}"]`);
    a[id] = r ? r.value : fs.length ? (items[id].fields.map((f, i) => f + ": " + fs[i].value.trim()).join("; ")) : (t ? t.value : ""); } return a; };
  v.oninput = () => local.set(draftKey, collect());
  v.querySelectorAll("[data-listen]").forEach(b => b.onclick = () => playScript(passages[b.dataset.listen], b));
  /* timer */
  const end = Date.now() + p.minutes * 60000; const tEl = $("#timer");
  const tick = () => { const s = Math.round((end - Date.now()) / 1000); const a = Math.abs(s);
    tEl.textContent = (s < 0 ? "Quá giờ " : "") + Math.floor(a/60) + ":" + String(a%60).padStart(2,"0"); tEl.classList.toggle("over", s < 0); };
  tick(); timerHandle = setInterval(tick, 1000);
  $("#submit").onclick = async () => {
    const a = collect(); Object.assign(attempt.answers, a);
    for (const id of p.items) { attempt.auto[id] = autoMark(items[id], a[id]); if (attempt.marks) delete attempt.marks[id]; }
    if (!attempt.partsDone.includes(n)) attempt.partsDone.push(n);
    markStudied();
    attempt.partsDone.sort();
    attempt.updatedAt = new Date().toISOString();
    $("#submit").disabled = true;
    await save("attempts/" + attempt.id, attempt);
    const next = placement.parts.find(x => !attempt.partsDone.includes(x.part));
    clearInterval(timerHandle);
    v.innerHTML = `<div class="card"><h2>Đã nộp phần ${n} ✓</h2>
      <p>${next ? `Còn phần ${next.part}: ${esc(next.name)} (${next.minutes} phút). Con có thể nghỉ một lát rồi làm tiếp, hoặc để hôm khác.` : "Cún đã làm xong cả 4 phần. Alex khen Cún giỏi lắm!"}</p>
      <div class="row">${next ? `<a class="btn" href="#part-${next.part}">Làm phần ${next.part}</a>` : ""}
      ${!next && pendingIds().length ? `<a class="btn pen" href="#marking">Phụ huynh chấm bài</a>` : ""}
      ${!next && !pendingIds().length ? `<a class="btn" href="#results">Xem kết quả</a>` : ""}
      <a class="btn ghost" href="#home">Về trang chính</a></div></div>`;
  };
}

function viewMarking(v){
  if (!attempt || !attempt.partsDone.length) { v.innerHTML = `<div class="card"><h2>Chấm bài</h2><p class="muted">Chưa có phần nào được nộp.</p><a class="btn" href="#home">Về trang chính</a></div>`; return; }
  const ids = placement.parts.filter(p => attempt.partsDone.includes(p.part)).flatMap(p => p.items);
  const need = ids.filter(id => attempt.auto[id] == null);
  const rest = ids.filter(id => attempt.auto[id] != null);
  const vn = bank.vietnamese;
  const block = id => { const it = items[id]; const m = maxPts(it); const cur = finalPts(id); const a = attempt.answers[id];
    const shownAns = it.type === "mcq" && a ? a + ". " + (it.options["ABCD".indexOf(a)] || "") : it.type === "true_false" && a ? (a === "T" ? "True" : "False") : a;
    const key = it.type === "mcq" ? it.answer + ". " + it.options["ABCD".indexOf(it.answer)] : it.type === "true_false" ? (it.answer === "T" ? "True" : "False") : it.answer;
    return `<div class="mark"><span class="qn">${esc(SECTIONS[sectionOf(id)].short)} · ${esc(id)}</span><div class="qt">${esc(it.question)}</div>
      <div><span class="small muted">Bài làm của con</span><div class="ans">${esc(shownAns || "(bỏ trống)")}</div></div>
      <div class="key">Gợi ý đáp án: ${esc(key)}${it.type === "writing" ? "\nThang điểm (quy về " + m + " điểm): " + vn.rubric_writing.criteria.map(c => c.name + " " + c.points + "đ").join("; ") : ""}</div>
      <div class="pts"><label for="m_${id}" class="small">Điểm (tối đa ${m})</label><input type="number" id="m_${id}" data-id="${id}" min="0" max="${m}" step="0.25" value="${cur ?? ""}">
      ${attempt.auto[id] != null ? `<span class="auto ${attempt.auto[id] >= m ? "ok" : "no"}">Máy chấm: ${attempt.auto[id]}/${m}</span>` : ""}</div></div>`; };
  v.innerHTML = `<div class="card"><h2>Phụ huynh chấm bài</h2>
    <p class="small muted">Câu viết, câu đọc hiểu mở và câu trả lời máy chưa chắc chắn cần phụ huynh cho điểm. Có thể chấm từng phần rồi bấm Lưu.</p></div>
    <div class="card">${need.length ? need.map(block).join("") : `<p class="muted">Không có câu nào cần chấm tay.</p>`}</div>
    <div class="row"><button class="btn pen" id="saveMarks">Lưu điểm</button><span class="small muted" id="saved"></span></div>
    <details class="card"><summary>Xem lại các câu máy đã chấm (${rest.length}) và sửa nếu cần</summary>${rest.map(block).join("")}</details>`;
  $("#saveMarks").onclick = async () => {
    attempt.marks = attempt.marks || {};
    v.querySelectorAll("input[data-id]").forEach(inp => { const id = inp.dataset.id; const m = maxPts(items[id]);
      if (inp.value === "") { if (attempt.auto[id] == null) delete attempt.marks[id]; return; }
      const x = Math.max(0, Math.min(m, parseFloat(inp.value)));
      if (attempt.auto[id] == null || x !== attempt.auto[id]) attempt.marks[id] = x; else delete attempt.marks[id]; });
    $("#saveMarks").disabled = true;
    await save("attempts/" + attempt.id, attempt);
    $("#saveMarks").disabled = false;
    const left = pendingIds().length;
    $("#saved").innerHTML = left ? `Đã lưu. Còn ${left} câu chưa chấm.` : `Đã lưu. <a href="#results">Xem kết quả</a>`;
  };
}
const sectionOf = id => placement.parts.find(p => p.items.includes(id)).section;

function viewResults(v){
  if (!attempt || attempt.partsDone.length < placement.parts.length) {
    v.innerHTML = `<div class="card"><h2>Kết quả</h2><p class="muted">Kết quả hiện ra khi con làm xong cả 4 phần.</p><a class="btn" href="#home">Về trang chính</a></div>`; return; }
  const sc = scoreSections(); const pend = pendingIds().length;
  const tile = s => { const r = sc[s]; const B = BANDS[r.band];
    const lv = [1,2,3].map(l => r.lv[l][1] ? `L${l}: ${Math.round(r.lv[l][0] / r.lv[l][1] * 100)}%` : "").filter(Boolean).join(" · ");
    return `<div class="score s-${s}"><span class="small">${esc(SECTIONS[s].name)}</span><span class="num">${r.pct}%</span>
      <div class="bar"><i style="width:${r.pct}%"></i></div><span class="band ${B.cls}">${B.name}</span><div class="lv">${lv}</div></div>`; };
  v.innerHTML = `<div class="card"><h2>Kết quả xếp lớp${attempt.student ? " · " + esc(attempt.student) : ""}</h2>
    ${pend ? `<div class="banner">Còn ${pend} câu chưa chấm, kết quả có thể thấp hơn thực tế. <a href="#marking">Chấm tiếp</a></div>` : ""}
    <div class="scores">${Object.keys(SECTIONS).map(tile).join("")}</div>
    <p class="small muted">L1 = mức lớp 4, L2 = mức lớp 5, L3 = mức đề thi. Nền tảng: dưới 40%. Đang phát triển: 40–70%. Sẵn sàng nâng cao: trên 70%.</p></div>
    <div class="card"><h3>Chủ đề cần luyện thêm</h3>
    ${Object.keys(SECTIONS).map(s => `<div><b class="s-${s}">${esc(SECTIONS[s].name)}</b>: ${sc[s].weak.length ? sc[s].weak.slice(0,5).map(t => esc(TOPIC[t] || t)).join(", ") : "không có câu sai"}</div>`).join("")}
    </div><div class="row"><a class="btn" href="#plan">Xem kế hoạch học</a><button class="btn ghost" id="exportBtn">Sao chép kết quả gửi Claude</button></div>
    <div class="card" id="exportBox" hidden><p class="small">Đã sao chép. Dán đoạn này vào tin nhắn gửi Claude để điều chỉnh kế hoạch. Nếu chưa sao chép được, hãy bôi đen và sao chép đoạn dưới.</p><textarea id="exportText" readonly></textarea></div>`;
  $("#exportBtn").onclick = () => {
    const txt = JSON.stringify({student: attempt.student, startedAt: attempt.startedAt, scores: Object.fromEntries(Object.entries(sc).map(([k,r]) => [k, {pct: r.pct, band: BANDS[r.band].name, weak: r.weak.map(t => TOPIC[t] || t)}])),
      answers: attempt.answers, auto: attempt.auto, marks: attempt.marks});
    $("#exportBox").hidden = false; const ta = $("#exportText"); ta.value = txt;
    try { navigator.clipboard.writeText(txt).catch(() => ta.select()); } catch { ta.select(); }
  };
}

function viewPlan(v){
  if (!attempt || attempt.partsDone.length < placement.parts.length) {
    v.innerHTML = `<div class="card"><h2>Kế hoạch học</h2><p class="muted">Kế hoạch được đề xuất sau khi con làm xong bài kiểm tra xếp lớp và phụ huynh chấm xong.</p><a class="btn" href="#home">Về trang chính</a></div>`; return; }
  const sc = scoreSections(); const plan = buildPlan(sc);
  const now = new Date();
  const isSaved = savedPlan && savedPlan.attemptId === attempt.id;
  v.innerHTML = `<div class="card"><h2>Kế hoạch học đề xuất</h2>
    <p>Giai đoạn hiện tại: <b>${esc(plan.phase)}</b>. Mỗi buổi khoảng ${plan.minutes} phút, ${plan.totalSessions} buổi mỗi tuần, Chủ Nhật nghỉ.
    Môn yếu hơn có nhiều buổi hơn; Tiếng Anh được ưu tiên vì chiếm khoảng một nửa số điểm của đề.</p>
    ${pendingIds().length ? `<div class="banner">Còn câu chưa chấm, kế hoạch sẽ chính xác hơn khi chấm xong. <a href="#marking">Chấm tiếp</a></div>` : ""}</div>
    <div class="card"><h3>Lịch mỗi tuần</h3><div class="week">${plan.week.filter(d => d.sessions.length).map(d => `<div class="day"><h3>${d.day}</h3>
      ${d.sessions.map(x => `<div class="sess s-${x.section}"><b>${esc(SECTIONS[x.section].short)} · ${x.minutes} phút</b><span><b>Trọng tâm:</b> ${esc(x.focus)}</span><span>${esc(x.activity)}</span></div>`).join("")}</div>`).join("")}</div></div>
    <div class="card"><h3>Lộ trình đến kỳ thi (khoảng tháng 7/2028)</h3><div class="phases">
      ${PHASES.map(p => { const on = now >= new Date(p.from) && now <= new Date(p.to + "T23:59:59+07:00");
        return `<div class="phase ${on ? "now" : ""}"><span class="dt">${new Date(p.from).toLocaleDateString("vi-VN",{month:"2-digit",year:"numeric"})} – ${new Date(p.to).toLocaleDateString("vi-VN",{month:"2-digit",year:"numeric"})}${on ? " · đang ở đây" : ""}</span><b>${esc(p.name)}</b><span class="small muted">${p.min} phút/buổi</span></div>`; }).join("")}
    </div><p class="small muted">Nên làm lại bài kiểm tra xếp lớp khoảng 3 tháng một lần để cập nhật kế hoạch.</p></div>
    <div class="row parent-only"><button class="btn" id="savePlan">${isSaved ? "Cập nhật kế hoạch đã lưu" : "Lưu kế hoạch này"}</button><span class="small muted" id="planMsg">${isSaved ? "Đã lưu ngày " + new Date(savedPlan.generatedAt).toLocaleDateString("vi-VN") : ""}</span></div>`;
  $("#savePlan").onclick = async () => {
    savedPlan = Object.assign({attemptId: attempt.id, student: attempt.student}, plan);
    $("#savePlan").disabled = true; await save("plans/current", savedPlan); $("#savePlan").disabled = false;
    $("#planMsg").textContent = "Đã lưu. Claude có thể đọc kế hoạch này để điều chỉnh khi cần.";
  };
}

/* ---------- boot ---------- */
async function boot(){
  try {
    const names = ["mc","english","math","vietnamese","placement-test"];
    const data = window.TDN_BANK ? names.map(n => window.TDN_BANK[n]) : await Promise.all(names.map(n => fetch("bank/" + n + ".json").then(r => { if (!r.ok) throw new Error(n); return r.json(); })));
    bank = {mc: data[0], english: data[1], math: data[2], vietnamese: data[3]}; placement = data[4]; placement.overrides = {};
    for (const p of placement.parts) Object.assign(placement.overrides, p.overrides || {});
    for (const s of Object.values(bank)) { for (const it of s.items) items[it.id] = it; for (const p of (s.passages || [])) passages[p.id] = p; }
  } catch (e) { $("#view").innerHTML = `<div class="card"><h2>Không tải được bộ câu hỏi</h2><p class="muted">Hãy tải lại trang. Nếu vẫn lỗi, nhắn Claude trong dự án.</p></div>`; return; }
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
  try { tts = window.claude && window.claude.use ? await window.claude.use("tts") : null; } catch { tts = null; }
  if (!db && !window.TDN_BANK) showBanner("Kết quả chỉ được lưu trên trình duyệt này (chưa kết nối nơi lưu chung).");
  meta = await load("meta/current");
  if (meta && meta.attemptId) attempt = await load("attempts/" + meta.attemptId);
  if (attempt) { attempt.answers = attempt.answers || {}; attempt.auto = attempt.auto || {}; attempt.marks = attempt.marks || {}; attempt.partsDone = attempt.partsDone || []; }
  savedPlan = await load("plans/current");
  route();
}
window.addEventListener("hashchange", route);
(window.TDN_UNLOCK ? window.TDN_UNLOCK.then(boot) : boot());
})();
</script>
</body></html>
